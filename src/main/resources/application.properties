server.port=8080
spring.application.name=kubeheal

# Target namespace to monitor
kubeheal.target-namespace=default
kubeheal.auto-remediation-enabled=true
kubeheal.debounce-seconds=60

# Optional Gemini API key (empty uses deterministic SRE heuristic engine)
kubeheal.gemini.api-key=
kubeheal.gemini.model=gemini-1.5-flash

# Logging
logging.level.com.nikhil.kubeheal=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
